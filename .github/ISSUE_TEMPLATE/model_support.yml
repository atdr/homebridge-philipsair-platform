name: Model support
description: Tell us how the plugin works with your Philips model, whether it works, misbehaves, or is not supported yet
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        This form covers three cases:

        - **It works.** A Supported model confirmed by its owner gets the ★ (validated) in the README. Supported mappings come from other projects, so a report from someone with the hardware is what turns them into tested ones.

        - **Some controls do not work** on a Supported model.

        - **Your model is not supported yet.** It runs a default mapping that suits many purifiers, but where it does not fit, controls do nothing or fan speeds land on the wrong setting.

        In every case the status dump below is what matters most: mappings are derived from what the device itself reports.

        Please write in plain English: short sentences, everyday words, and exactly what you saw. There is no need to write it up formally.

  - type: dropdown
    id: report
    attributes:
      label: What are you reporting?
      options:
        - It works, please mark this model as validated

        - Some controls do not work

        - My model is not supported yet
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Device model
      description: The full ID exactly as printed on the device label, regional suffix included, e.g. `AC0850/31`. Some models ship in two register dialects under the same base ID, and the suffix tells them apart.
      placeholder: AC0820/10
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Plugin version
      description: Shown in the Homebridge UI under Plugins. Please test on the latest release.
      placeholder: 1.5.0
    validations:
      required: true

  - type: textarea
    id: status-dump
    attributes:
      label: Status dump
      description: |
        Run `aioairctrl -H <device-ip> -P 5683 status -J` with the purifier switched **on** and Homebridge stopped (these purifiers serve one connection at a time). Allow up to 90 seconds for a reply.
      render: json
    validations:
      required: true

  - type: textarea
    id: checks
    attributes:
      label: What works and what does not
      description: |
        With the model set in the plugin config, check each control in the Home app and say what happened on the purifier:

        - On and off, and 0% on the slider switching it off

        - Auto and Manual on the switch, and whether the switch shows the mode the purifier is in (also after changing it on the panel)

        - Each slider step, and which setting it lands on at the purifier

        - Display light and brightness, child lock and humidifier, where your model has them

        "All of it works" is a perfectly good answer.
    validations:
      required: true

  - type: textarea
    id: capabilities
    attributes:
      label: What the device can do
      description: |
        Optional but helpful: the fan speeds and modes on the unit itself, and whether it has a humidifier, a child lock, a display light, or a filter reset.
    validations:
      required: false

  - type: checkboxes
    id: testing
    attributes:
      label: Testing
      options:
        - label: I can run further commands against this device and report what happens
          required: false
        - label: I can install a prerelease build to verify a mapping before it ships
          required: false
