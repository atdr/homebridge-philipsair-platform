version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # `prefix` covers production dependencies, `prefix-development` the rest. This
    # package publishes a tarball and npm never includes package-lock.json, so
    # consumers resolve their own tree from the ranges in package.json: only a direct
    # production bump reaches them, which is why that case earns a `fix` and a patch
    # release. The scope lives in the prefix, so no `include: scope`.
    #
    # Both are `chore` today because there are no runtime dependencies, so no bump can
    # reach a user and none should cut a release. `prefix` is not simply unused in the
    # meantime: Dependabot cannot tell that a transitive dependency belongs to the dev
    # tree, so it falls back to `prefix` for those, and js-yaml (a linter's transitive
    # dependency, via commitlint and cosmiconfig) arrived as `fix(deps)` on PR #109 and
    # would have cut a release for a lockfile change nobody installs.
    #
    # Restore `prefix: fix(deps)` when a runtime dependency is first declared.
    # test/dependabot-config.test.js fails on the PR that declares one, so this is
    # enforced rather than remembered.
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps)
    # Security updates are enabled in repo settings, not here, and are deliberately
    # left ungrouped. A group with `applies-to: security-updates` used to batch the
    # development ones; it filtered a high js-yaml advisory out of its own update job
    # and still reported success, so the alert sat open with nothing to show for it
    # (alert 14, September 2026, run 34416108439). A security signal that disappears
    # into a green job is the one failure shape worth spending config to avoid.
    #
    # Grouping was not buying much anyway: advisories arrive here one at a time. Of the
    # fourteen alerts to date, five were the one-off backfill when alerting was first
    # switched on and nine of the remaining ten arrived alone, leaving a single same-day
    # pair for a group to coalesce. Guarded by test/dependabot-config.test.js.
    groups:
      # `applies-to` defaults to version-updates, which is why this group needs
      # no such key. Production version updates are deliberately ungrouped so
      # each arrives as its own reviewable `fix` PR.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Moving major tags (@v7) absorb minor and patch action updates automatically
  # but never cross majors; this surfaces new majors as PRs.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
