name: Release Please

on:
  push:
    branches: [main]
  # Manual prerelease publishing. Kept in this file because npm's trusted
  # publisher is pinned to one workflow filename per package, so a separate
  # workflow would fail OIDC authentication.
  workflow_dispatch:
    inputs:
      version:
        description: 'Prerelease version to publish, e.g. 1.2.0-beta.1'
        required: true
      dist_tag:
        description: "npm dist-tag to publish under (never 'latest')"
        required: true
        default: beta

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing (provenance is automatic)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # trusted publishing needs npm >= 11.5.1, bundled with Node >= 24.5
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish

  publish-prerelease:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing (provenance is automatic)
    env:
      # Read through the environment rather than inlined into the run scripts,
      # so a dispatch input can never be interpreted as shell.
      VERSION: ${{ inputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - name: Refuse a stable version or the latest dist-tag
        run: |
          case "$VERSION" in
            *-*) ;;
            *) echo "::error::'$VERSION' is not a prerelease version (expected a suffix, e.g. 1.2.0-beta.1)"; exit 1 ;;
          esac
          if [ "$DIST_TAG" = latest ]; then
            echo "::error::refusing to move the latest dist-tag"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # trusted publishing needs npm >= 11.5.1, bundled with Node >= 24.5
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Runner-local bump, never committed: main keeps its released version and
      # the pending release-please PR keeps proposing a clean next version.
      - run: npm version "$VERSION" --no-git-tag-version
      - run: npm publish --tag "$DIST_TAG"
